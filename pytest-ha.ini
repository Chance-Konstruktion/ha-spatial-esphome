[pytest]
# Eigene Konfiguration fuer die Tests gegen ein echtes Home Assistant.
#
# Sie koennen nicht im selben Lauf stehen wie tests/: dessen conftest.py
# ersetzt das ganze Paket ``homeassistant`` in sys.modules durch Attrappen.
# Was danach ``import homeassistant`` sagt, bekommt die Attrappe -- egal
# wie echt die Installation daneben ist. Zwei Verzeichnisse, zwei Laeufe.
testpaths = tests_ha
pythonpath = .
asyncio_mode = auto
